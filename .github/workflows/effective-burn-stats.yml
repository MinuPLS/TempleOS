name: Static Dashboard Snapshots

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: effective-burn-stats
  cancel-in-progress: false

jobs:
  update-effective-burn-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update static dashboard data
        run: |
          node scripts/update-effective-burn-stats.mjs
          node scripts/update-divine-manager-feed-snapshot.mjs
          node scripts/update-divine-manager-pools-snapshot.mjs
        env:
          PULSECHAIN_RPC_URL: ${{ secrets.PULSECHAIN_RPC_URL }}

      - name: Commit snapshots if changed
        run: |
          if git status --porcelain | grep -Eq "public/(effective-burn-stats|divine-manager-(feed|pools))\.json"; then
            git config user.name "dashboard-snapshot-bot"
            git config user.email "dashboard-snapshot-bot@users.noreply.github.com"
            git add public/effective-burn-stats.json public/divine-manager-feed.json public/divine-manager-pools.json
            git commit -m "chore(stats): update dashboard snapshots"
            git push
          else
            echo "No snapshot changes"
          fi
