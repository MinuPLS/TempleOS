name = "divine-manager-feed"
main = "src/index.js"
compatibility_date = "2024-11-24"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "divine-manager-feed"
# Set this to the identifier printed by `wrangler d1 create divine-manager-feed`.
database_id = "5cfdbf9b-a6a0-443e-bf48-501f01a0656e"

[vars]
RPC_URL = "https://rpc.pulsechain.com"
REORG_OVERLAP_BLOCKS = "8"
# The initial sync processes this many historical executions per minute. It only
# stores successful TicketExecuted transactions, not failed attempts or raw logs.
HISTORICAL_BATCH_SIZE = "25"

[observability]
enabled = true

[observability.logs]
enabled = true
persist = true
